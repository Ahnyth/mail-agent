  text: |
    Sehr geehrte Damen und Herren,

    die Verordnung häuslicher Krankenpflege für Herrn Karl Brandt vom 12.10.2026 haben wir geprüft.
    Die Medikamentengabe genehmigen wir wie verordnet. Das An- und Ausziehen der
    Kompressionsstrümpfe können wir nur einmal täglich statt zweimal täglich übernehmen.
    Die Begründung entnehmen Sie bitte dem beigefügten Bescheid.

    Gegen diesen Bescheid kann innerhalb eines Monats nach Bekanntgabe Widerspruch
    erhoben werden. Eine Kopie erhält der Versicherte.

    Mit freundlichen Grüßen
    AOK Musterland – Team Häusliche Krankenpflege
