  text: |
    Sehr geehrte Damen und Herren,

    als Leistungserbringer erhalten Sie zur Kenntnis eine Kopie unseres Bescheides über
    Hilfe zur Pflege für Frau Marianne Engel. Die Kosten der häuslichen Pflege werden ab
    01.10.2026 übernommen, soweit sie die Leistungen der Pflegekasse übersteigen; für die
    beantragten zusätzlichen Betreuungsstunden wird die Übernahme abgelehnt.

    Gegen diesen Bescheid kann innerhalb eines Monats nach Bekanntgabe Widerspruch beim
    Landratsamt Musterkreis erhoben werden.

    Mit freundlichen Grüßen
    Landratsamt Musterkreis, Sozialamt
