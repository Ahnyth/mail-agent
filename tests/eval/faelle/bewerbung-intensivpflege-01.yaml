    Sehr geehrte Damen und Herren,

    ich bin Gesundheits- und Krankenpfleger und seit acht Jahren auf einer internistischen
    Intensivstation tätig, davon drei Jahre mit Schwerpunkt Weaning. Ich bin sicher im Umgang
    mit invasiver und nicht-invasiver Beatmung sowie im Trachealkanülenmanagement und habe
    2025 die Weiterbildung zum Atmungstherapeuten abgeschlossen.

    Gern würde ich in der 1:1-Versorgung in Ihrem Intensivpflegeteam arbeiten.
    Meine Unterlagen finden Sie im Anhang. Wann wäre ein Kennenlernen möglich?

    Mit freundlichen Grüßen
    Sven Becker
